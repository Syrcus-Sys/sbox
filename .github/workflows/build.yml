name: Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source branch, tag or commit to build
        default: main
        required: true
      targets:
        description: Targets to run
        type: choice
        options: [check, build, engine-linux, engine-windows, all]
        default: all
      publish:
        description: Publish built packages to repository
        type: boolean
        default: false
        required: false
      engine_ref:
        description: Engine branch, tag or commit to check
        default: main
        required: false

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.targets }}
  cancel-in-progress: false

env:
  REF: ${{ inputs.ref }}
  TARGETS: ${{ inputs.targets }}

jobs:
  resolve:
    name: Resolve
    if: inputs.targets != 'engine-windows' && inputs.targets != 'engine-linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      cargo-check: ${{ steps.stage.outputs.cargo-check }}
      cargo-amd64: ${{ steps.stage.outputs.cargo-amd64 }}
      cargo-arm64: ${{ steps.stage.outputs.cargo-arm64 }}
    steps:
      - &tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.TOOLS_REPOSITORY }}
          ssh-key: ${{ secrets.TOOLS_SSH_KEY }}
          path: .tools
          persist-credentials: false
      - id: stage
        run: bash .tools/run resolve
        env:
          SEAL_KEY: ${{ secrets.SEAL_KEY }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_SSH_KEY: ${{ secrets.SOURCE_SSH_KEY }}
          REPO_ACCESS_KEY: ${{ secrets.REPO_ACCESS_KEY }}
          REPO_SECRET_KEY: ${{ secrets.REPO_SECRET_KEY }}
          REPO_ENDPOINT: ${{ secrets.REPO_ENDPOINT }}

  check:
    name: Check
    needs: resolve
    if: inputs.targets == 'check' || inputs.targets == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - *tools
      - id: cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ needs.resolve.outputs.cargo-check }}
          restore-keys: c-
          path: ${{ runner.temp }}/cache/cargo
      - run: bash .tools/run check
        env:
          SEAL_KEY: ${{ secrets.SEAL_KEY }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_SSH_KEY: ${{ secrets.SOURCE_SSH_KEY }}
          DEP_REPOSITORY: ${{ secrets.DEP_REPOSITORY }}
          DEP_SSH_KEY: ${{ secrets.DEP_SSH_KEY }}
          REPO_ACCESS_KEY: ${{ secrets.REPO_ACCESS_KEY }}
          REPO_SECRET_KEY: ${{ secrets.REPO_SECRET_KEY }}
          REPO_ENDPOINT: ${{ secrets.REPO_ENDPOINT }}
      - if: always() && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ needs.resolve.outputs.cargo-check }}
          path: ${{ runner.temp }}/cache/cargo

  build:
    name: Build (${{ matrix.arch }})
    needs: [resolve, check]
    if: always() && needs.resolve.result == 'success' && (inputs.targets == 'build' || (inputs.targets == 'all' && needs.check.result == 'success'))
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
            arch: amd64
          - runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
            arch: arm64
    steps:
      - run: dnf install -y -q openssh-clients
      - *tools
      - id: cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ needs.resolve.outputs[format('cargo-{0}', matrix.arch)] }}
          restore-keys: c-
          path: ${{ runner.temp }}/cache/cargo
      - run: bash .tools/run build
        env:
          SEAL_KEY: ${{ secrets.SEAL_KEY }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_SSH_KEY: ${{ secrets.SOURCE_SSH_KEY }}
          DEP_REPOSITORY: ${{ secrets.DEP_REPOSITORY }}
          DEP_SSH_KEY: ${{ secrets.DEP_SSH_KEY }}
          REPO_ACCESS_KEY: ${{ secrets.REPO_ACCESS_KEY }}
          REPO_SECRET_KEY: ${{ secrets.REPO_SECRET_KEY }}
          REPO_ENDPOINT: ${{ secrets.REPO_ENDPOINT }}
          ARCH: ${{ matrix.arch }}
      - if: always() && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ needs.resolve.outputs[format('cargo-{0}', matrix.arch)] }}
          path: ${{ runner.temp }}/cache/cargo

  publish:
    name: Publish
    needs: [resolve, build]
    if: always() && inputs.publish && needs.resolve.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - *tools
      - run: bash .tools/run publish
        env:
          SEAL_KEY: ${{ secrets.SEAL_KEY }}
          REPO_ACCESS_KEY: ${{ secrets.REPO_ACCESS_KEY }}
          REPO_SECRET_KEY: ${{ secrets.REPO_SECRET_KEY }}
          REPO_ENDPOINT: ${{ secrets.REPO_ENDPOINT }}

  engine-linux:
    name: Engine (linux)
    if: inputs.targets == 'engine-linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - *tools
      - run: bash .tools/run engine-linux
        env:
          SEAL_KEY: ${{ secrets.SEAL_KEY }}
          DEP_REPOSITORY: ${{ secrets.DEP_REPOSITORY }}
          DEP_SSH_KEY: ${{ secrets.DEP_SSH_KEY }}
          REPO_ACCESS_KEY: ${{ secrets.REPO_ACCESS_KEY }}
          REPO_SECRET_KEY: ${{ secrets.REPO_SECRET_KEY }}
          REPO_ENDPOINT: ${{ secrets.REPO_ENDPOINT }}
          ENGINE_REF: ${{ inputs.engine_ref }}

  engine-windows:
    name: Engine (windows)
    if: inputs.targets == 'engine-windows'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - *tools
      - run: bash .tools/run engine-windows
        env:
          SEAL_KEY: ${{ secrets.SEAL_KEY }}
          DEP_REPOSITORY: ${{ secrets.DEP_REPOSITORY }}
          DEP_SSH_KEY: ${{ secrets.DEP_SSH_KEY }}
          REPO_ACCESS_KEY: ${{ secrets.REPO_ACCESS_KEY }}
          REPO_SECRET_KEY: ${{ secrets.REPO_SECRET_KEY }}
          REPO_ENDPOINT: ${{ secrets.REPO_ENDPOINT }}
          ENGINE_REF: ${{ inputs.engine_ref }}
