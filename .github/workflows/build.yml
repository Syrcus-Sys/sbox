name: Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source branch, tag or commit to build
        default: main
        required: true
      targets:
        description: Targets to run
        type: choice
        options: [check, build, image, all]
        default: all

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.targets }}
  cancel-in-progress: false

env:
  REF: ${{ inputs.ref }}
  TARGETS: ${{ inputs.targets }}

jobs:
  resolve:
    name: Resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      cargo-check: ${{ steps.stage.outputs.cargo-check }}
      cargo-amd64: ${{ steps.stage.outputs.cargo-amd64 }}
      cargo-arm64: ${{ steps.stage.outputs.cargo-arm64 }}
    steps:
      - &tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.TOOLS_REPOSITORY }}
          ssh-key: ${{ secrets.TOOLS_SSH_KEY }}
          path: .tools
          persist-credentials: false
      - id: stage
        run: bash .tools/run resolve
        env:
          SEAL_KEY: ${{ secrets.SEAL_KEY }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_SSH_KEY: ${{ secrets.SOURCE_SSH_KEY }}
      - &sealed
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: out-${{ github.job }}
          path: ${{ runner.temp }}/sealed
          if-no-files-found: ignore
          retention-days: 1

  check:
    name: Check
    needs: resolve
    if: inputs.targets == 'check' || inputs.targets == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - *tools
      - &inbox
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: out-*
          merge-multiple: true
          path: ${{ runner.temp }}/inbox
      - id: cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ needs.resolve.outputs.cargo-check }}
          restore-keys: c-
          path: ${{ runner.temp }}/cache/cargo
      - run: bash .tools/run check
        env:
          SEAL_KEY: ${{ secrets.SEAL_KEY }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_SSH_KEY: ${{ secrets.SOURCE_SSH_KEY }}
          DEP_REPOSITORY: ${{ secrets.DEP_REPOSITORY }}
          DEP_SSH_KEY: ${{ secrets.DEP_SSH_KEY }}
      - *sealed
      - if: always() && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ needs.resolve.outputs.cargo-check }}
          path: ${{ runner.temp }}/cache/cargo

  build:
    name: Build (${{ matrix.arch }})
    needs: [resolve, check]
    if: needs.resolve.result == 'success' && (inputs.targets == 'build' || (inputs.targets == 'all' && needs.check.result == 'success'))
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
            arch: amd64
          - runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
            arch: arm64
    steps:
      - run: dnf install -y -q openssh-clients
      - *tools
      - *inbox
      - id: cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ needs.resolve.outputs[format('cargo-{0}', matrix.arch)] }}
          restore-keys: c-
          path: ${{ runner.temp }}/cache/cargo
      - run: bash .tools/run build
        env:
          SEAL_KEY: ${{ secrets.SEAL_KEY }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_SSH_KEY: ${{ secrets.SOURCE_SSH_KEY }}
          DEP_REPOSITORY: ${{ secrets.DEP_REPOSITORY }}
          DEP_SSH_KEY: ${{ secrets.DEP_SSH_KEY }}
          ARCH: ${{ matrix.arch }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: out-${{ github.job }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/sealed
          if-no-files-found: ignore
          retention-days: 1
      - if: always() && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ needs.resolve.outputs[format('cargo-{0}', matrix.arch)] }}
          path: ${{ runner.temp }}/cache/cargo

  image:
    name: Image
    needs: [resolve, check]
    if: needs.resolve.result == 'success' && (inputs.targets == 'image' || (inputs.targets == 'all' && needs.check.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - *tools
      - *inbox
      - run: bash .tools/run image
        env:
          SEAL_KEY: ${{ secrets.SEAL_KEY }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_SSH_KEY: ${{ secrets.SOURCE_SSH_KEY }}
          DEP_REPOSITORY: ${{ secrets.DEP_REPOSITORY }}
          DEP_SSH_KEY: ${{ secrets.DEP_SSH_KEY }}
          GEO_TOKEN: ${{ secrets.GEO_TOKEN }}
      - *sealed
